<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Survey • Umizoomi</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
<div class="nav-wrap">
  <a class="brand" href="index.html">Team Umizoomi</a>
  <div class="actions">
    <button class="menu-btn" onclick="App.toggleNav()" title="Toggle Menu">☰</button>
    <button class="theme-toggle" onclick="App.toggleTheme()" title="Toggle Parchment Mode">☼</button>
  </div>
</div>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">Team Umizoomi</a>
    <nav class="nav">
      <a class="nav-link" href="index.html">Home</a> <a class="nav-link" href="budget.html">Budget</a> <a class="nav-link active" href="survey.html">Survey</a> <a class="nav-link" href="dashboard.html">Dashboard</a> <a class="nav-link" href="about.html">About</a>
    </nav>
    <button class="menu-btn" aria-label="Toggle menu" onclick="document.body.classList.toggle('open')">☰</button>
  </div>
</header>

  <main class="container">
    
<section class="section">
  <h1>Budget Survey</h1>
  <p>Answer a few questions to get a recommended budget plan.</p>
  <form class="panel" id="survey-form">
    <label>1) Savings priority?
      <select name="savings">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label>2) Housing cost relative to income?
      <select name="housing">
        <option value="low">&lt; 25%</option>
        <option value="medium">25–35%</option>
        <option value="high">&gt; 35%</option>
      </select>
    </label>
    <label>3) Lifestyle spending (eating out, fun)?
      <select name="lifestyle">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </label>
    <button class="btn primary" type="button" onclick="App.scoreSurvey()">Get Plan</button>
  </form>

  <div class="panel" id="plan-result" hidden>
    <h2>Recommended Plan</h2>
    <p id="plan-name">—</p>
    <ul id="plan-targets" class="targets"></ul>
  </div>
</section>

  </main>
  <footer class="site-footer">
    <div class="container">© 2025 Team Umizoomi • Student Budgeting</div>
  </footer>
</body>
</html>
