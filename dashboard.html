<!doctype html>
<html lang="en" data-accent="green">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard • Umizoomi</title>
  <link rel="stylesheet" href="css/styles-v2.css" />
  <script defer src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">Team Umizoomi</a>
    <div class="actions">
      <div class="palette" title="Accent">
        <button class="swatch green" onclick="App.setAccent('green')" aria-label="Green"></button>
        <button class="swatch teal" onclick="App.setAccent('teal')" aria-label="Teal"></button>
        <button class="swatch gold" onclick="App.setAccent('gold')" aria-label="Gold"></button>
        <button class="swatch violet" onclick="App.setAccent('violet')" aria-label="Violet"></button>
      </div>
      <button class="icon-btn" onclick="App.toggleTheme()" title="Toggle Parchment Mode">☼</button>
      <button class="icon-btn" onclick="App.toggleNav()" title="Toggle Menu">☰</button>
    </div>
  </div>
</header>
<nav class="nav">
  <a class="nav-link" href="index.html">Home</a>
  <a class="nav-link" href="budget.html">Budget</a>
  <a class="nav-link" href="survey.html">Survey</a>
  <a class="nav-link" href="dashboard.html">Dashboard</a>
  <a class="nav-link" href="about.html">About</a>
</nav>

  <main class="container">

<section class="section">
  <h1>Dashboard</h1>
  <p>A quick look at your current month.</p>
  <div class="grid two">
    <div class="panel">
      <h2>Category Breakdown</h2>
      <canvas id="catChart" width="420" height="320" aria-label="Category chart"></canvas>
    </div>
    <div class="panel">
      <h2>Summary</h2>
      <ul class="stats-list" id="summaryList">
        <li><span>Income</span><strong id="sumIncome">$0</strong></li>
        <li><span>Expenses</span><strong id="sumExpenses">$0</strong></li>
        <li><span>Remaining</span><strong id="sumRemaining">$0</strong></li>
      </ul>
      <div class="actions" style="margin-top:.75rem;">
        <button class="btn" onclick="App.exportJSON()">Export JSON</button>
      </div>
    </div>
  </div>
</section>

  </main>
  <footer class="site-footer">
    © 2025 Team Umizoomi • Student Budgeting
  </footer>
</body>
</html>
