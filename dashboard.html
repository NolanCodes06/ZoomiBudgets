<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard • Umizoomi</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
<div class="nav-wrap">
  <a class="brand" href="index.html">Team Umizoomi</a>
  <div class="actions">
    <button class="menu-btn" onclick="App.toggleNav()" title="Toggle Menu">☰</button>
    <button class="theme-toggle" onclick="App.toggleTheme()" title="Toggle Parchment Mode">☼</button>
  </div>
</div>
 
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">Team Umizoomi</a>
    <nav class="nav">
      <a class="nav-link" href="index.html">Home</a> <a class="nav-link" href="budget.html">Budget</a> <a class="nav-link" href="survey.html">Survey</a> <a class="nav-link active" href="dashboard.html">Dashboard</a> <a class="nav-link" href="about.html">About</a>
    </nav>
    <button class="menu-btn" aria-label="Toggle menu" onclick="document.body.classList.toggle('open')">☰</button>
  </div>
</header>

  <main class="container">
    
<section class="section">
  <h1>Dashboard</h1>
  <p>A quick look at your current month.</p>
  <div class="grid two">
    <div class="panel">
      <h2>Category Breakdown</h2>
      <canvas id="catChart" width="400" height="300" aria-label="Category chart"></canvas>
    </div>
    <div class="panel">
      <h2>Summary</h2>
      <ul class="stats-list" id="summaryList">
        <li><span>Income</span><strong id="sumIncome">$0</strong></li>
        <li><span>Expenses</span><strong id="sumExpenses">$0</strong></li>
        <li><span>Remaining</span><strong id="sumRemaining">$0</strong></li>
      </ul>
      <div class="actions">
        <button class="btn" onclick="App.exportJSON()">Export JSON</button>
      </div>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  </main>
  <footer class="site-footer">
    <div class="container">© 2025 Team Umizoomi • Student Budgeting</div>
  </footer>
</body>
</html>
