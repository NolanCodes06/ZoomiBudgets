<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZoomiBudgets • Achievements</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">

    <header class="topbar">
      <div class="topbar-left">
<div class="brand-mark">
  <img src="assets/logo.png" alt="ZoomiBudgets logo" class="brand-logo" />
</div>
<div class="brand-title">
  <div class="brand-title-main">ZoomiBudgets</div>
          <div class="brand-title-sub">Achievements</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="menu-toggle">
          <span></span>
        </button>
      </div>
    </header>

    <aside id="sidebar"></aside>

    <main class="app-main">
      <div class="page">

        <div class="page-header">
          <div class="page-kicker">Game Layer</div>
          <h1 class="page-title">Achievements</h1>
          <p class="subtitle">
            These unlock automatically as you use the app. No grinding, just proof that you're doing the work.
          </p>
        </div>

        <section class="section card">
          <div id="achievements-summary"></div>
          <div id="achievements-list" style="margin-top:.5rem;"></div>
        </section>

      </div>
    </main>
  </div>

  <script type="module" src="js/app.js" defer></script>
</body>
</html>
