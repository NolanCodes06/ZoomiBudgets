
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Budget • Umizoomi</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
<div class="nav-wrap">
  <a class="brand" href="index.html">Team Umizoomi</a>
  <div class="actions">
    <button class="menu-btn" onclick="App.toggleNav()" title="Toggle Menu">☰</button>
    <button class="theme-toggle" onclick="App.toggleTheme()" title="Toggle Parchment Mode">☼</button>
  </div>
</div>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">Team Umizoomi</a>
    <nav class="nav">
      <a class="nav-link" href="index.html">Home</a> <a class="nav-link active" href="budget.html">Budget</a> <a class="nav-link" href="survey.html">Survey</a> <a class="nav-link" href="dashboard.html">Dashboard</a> <a class="nav-link" href="about.html">About</a>
    </nav>
    <button class="menu-btn" aria-label="Toggle menu" onclick="document.body.classList.toggle('open')">☰</button>
  </div>
</header>

  <main class="container">
    
<section class="section">
  <h1>Budget</h1>
  <p>Enter income and expenses. Your totals update automatically.</p>
  <div class="grid two">
    <form class="panel" id="income-form">
      <h2>Income</h2>
      <label>Primary Income <input type="number" step="0.01" name="primary" placeholder="e.g., 1200"></label>
      <label>Other Income <input type="number" step="0.01" name="other" placeholder="e.g., 300"></label>
      <button class="btn" type="button" onclick="App.saveIncome()">Save Income</button>
    </form>

    <form class="panel" id="expense-form">
      <h2>Expenses</h2>
      <label>Rent <input type="number" step="0.01" name="rent" placeholder="e.g., 600"></label>
      <label>Food <input type="number" step="0.01" name="food" placeholder="e.g., 220"></label>
      <label>Transportation <input type="number" step="0.01" name="transportation" placeholder="e.g., 120"></label>
      <label>Entertainment <input type="number" step="0.01" name="entertainment" placeholder="e.g., 60"></label>
      <label>Savings <input type="number" step="0.01" name="savings" placeholder="e.g., 100"></label>
      <label>Other <input type="number" step="0.01" name="other" placeholder="e.g., 0"></label>
      <button class="btn" type="button" onclick="App.saveExpenses()">Save Expenses</button>
    </form>
  </div>

  <div class="panel totals" id="totals">
    <h2>Totals</h2>
    <div class="stat"><span>Total Income:</span><strong id="totalIncome">$0</strong></div>
    <div class="stat"><span>Total Expenses:</span><strong id="totalExpenses">$0</strong></div>
    <div class="stat remaining"><span>Remaining:</span><strong id="remaining">$0</strong></div>
    <button class="btn subtle" onclick="App.resetData()">Reset Data</button>
  </div>
</section>

  </main>
  <footer class="site-footer">
    <div class="container">© 2025 Team Umizoomi • Student Budgeting</div>
  </footer>
</body>
</html>
